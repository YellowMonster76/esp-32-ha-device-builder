    entity_id: ${s1_feed}
    attribute: stale
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_quiet
    entity_id: ${s1_feed}
    attribute: quiet
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_last_t
    entity_id: ${s1_last}
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_last_l
    entity_id: ${s1_last}
    attribute: line
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_first
    entity_id: ${s1_first}
    internal: true
    on_value: {script.execute: refresh}
  # ---- stop 2: ${s2_title} ----
  # The entity state: a timestamp, or unknown/unavailable when there's no bus.
  # This decides "is there a bus?" (HA doesn't clear attributes).
  - platform: homeassistant
    id: s2_state
    entity_id: ${s2_next}
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s2_line
    entity_id: ${s2_next}
    attribute: line
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s2_dest
    entity_id: ${s2_next}
    attribute: destination
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s2_sched
    entity_id: ${s2_next}
    attribute: scheduled
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s2_delay
    entity_id: ${s2_next}
    attribute: delay
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s2_live
    entity_id: ${s2_next}
