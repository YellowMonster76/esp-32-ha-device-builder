# =============================================================================
#  GENERATED single-file version of esp32-4in-bus-display-2stop.yaml.
#  Paste the whole file into ESPHome Device Builder. Don't edit it here:
#  edit the source files, then run `python tools/flatten.py`.
#
#  Built from:
#    common/base.yaml
#    boards/esp32-4in-st7796s.yaml
#    projects/bus-display/bus-display-2stop-480x320.yaml
#    projects/bus-display/brightness.yaml
#    esp32-4in-bus-display-2stop.yaml
#
#  Secrets it needs in Device Builder's secrets.yaml:
#    bus_4in_api_key
#    bus_4in_fallback_password
#    wifi_password
#    wifi_ssid
# =============================================================================

# =============================================================================
#  Device: 4in Bus Display (two stops)
#  Board:   boards/esp32-4in-st7796s.yaml   (MAC 20:50:0d:1d:fe:8f (last 3 bytes randomised))
#  Project: projects/bus-display (bus-display-2stop-480x320.yaml + brightness.yaml)
#
#  EXAMPLE STOPS: "High Street" and "Market Square" are placeholders, and so
#  are their entity IDs. Point them at your own stops' sensors (see
#  projects/bus-display/README.md for what each must provide). The layout was
#  tested on the real board with the demo build; this file hasn't been run
#  against HA.
# =============================================================================


# =============================================================================
#  Shared by every device: identity, logging, OTA, Wi-Fi.
#
#  The device file must provide:
#    substitutions: name, friendly_name
#    api:  encryption: key: !secret <device>_api_key
#    wifi: ap: ssid / password (the fallback hotspot)
#  Those stay in the device file because they're per-unit, and !secret can't
#  be driven by a substitution.
# =============================================================================

substitutions:
  # --- from common/base.yaml ---
  # C++ expression projects use for "is Home Assistant connected?". Demo builds
  # (tools/demo) override it to fake a connection without HA.
  ha_connected: "(api::global_api_server != nullptr && api::global_api_server->is_connected_with_state_subscription())"

  # --- from boards/esp32-4in-st7796s.yaml ---
  # ---- Touch calibration (raw XPT2046 readings at the screen edges) --------
  # Measured on our unit. Measure each unit if it has touch targets: see
  # esp32-4in-st7796s.md, "Calibrating touch".
  touch_x_min: "109"
  touch_x_max: "4034"
  touch_y_min: "140"
  touch_y_max: "3984"

  # --- from projects/bus-display/bus-display-2stop-480x320.yaml ---
  # ---- The two stops (override in the device file) --------------------------
  # sN_title  name shown on the card (about 13 characters fit)
  # sN_next   next departure: state + line, destination, scheduled, delay,
  #           live, following
  # sN_feed   feed health: attributes stale, quiet
  # sN_last   last departure of the day: state "HH:MM" + attribute line
  # sN_first  first bus of the morning: state "HH:MM" (optional sensor)
  s1_title: "HIGH STREET"  # set in esp32-4in-bus-display-2stop.yaml
  s1_next: sensor.bus_next_high_street  # set in esp32-4in-bus-display-2stop.yaml
  s1_feed: sensor.bus_oxontime_high_street  # set in esp32-4in-bus-display-2stop.yaml
  s1_last: sensor.bus_last_high_street  # set in esp32-4in-bus-display-2stop.yaml
  s1_first: sensor.bus_first_high_street  # set in esp32-4in-bus-display-2stop.yaml
  s2_title: "MARKET SQUARE"  # set in esp32-4in-bus-display-2stop.yaml
  s2_next: sensor.bus_next_market_square  # set in esp32-4in-bus-display-2stop.yaml
  s2_feed: sensor.bus_oxontime_market_square  # set in esp32-4in-bus-display-2stop.yaml
  s2_last: sensor.bus_last_market_square  # set in esp32-4in-bus-display-2stop.yaml
  s2_first: sensor.bus_first_market_square  # set in esp32-4in-bus-display-2stop.yaml

  # ---- Lateness thresholds (minutes, from the `delay` attribute) ------------
  # Same meaning as in bus-display.yaml.
  early_warn: "-2"
  late_amber: "2"
  late_red: "6"
  overdue_after: "2"
  gone_after: "30"

  # --- from projects/bus-display/brightness.yaml ---
  # ---- Auto-brightness (follows the sun, from HA's sun.sun) -----------------
  # Sun elevation between these two angles maps linearly onto brightness.
  # (Not a light sensor: the CYD's LDR can't tell a lit room from a dark one.
  # See boards/cyd-2432s028.md, quirks.)
  sun_day_deg: "4"       # sun at/above this: full brightness
  sun_night_deg: "-6"    # sun at/below this (end of civil dusk): minimum
  bl_min: "0.35"         # dimmest the backlight goes (0-1). 0 = off.
  bl_max: "1.0"          # brightest it goes (0-1)
  touch_boost_s: "30s"   # tap the screen: full brightness for this long

  # --- from esp32-4in-bus-display-2stop.yaml ---
  name: esp32-4in-bus-display-2stop
  friendly_name: 4in Bus Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  # (from projects/bus-display/bus-display-2stop-480x320.yaml)
  on_boot:
    priority: -100
    then:
      - script.execute: refresh

logger:
  level: INFO

# OTA uploads are encrypted and authenticated with the device's API key (an
# empty `encryption:` block means "use the api key"), so no OTA password.
ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails, the device starts its own hotspot (ssid/password set in the
  # device file). Join it and browse to 192.168.4.1 to enter new Wi-Fi details.

  # (from esp32-4in-bus-display-2stop.yaml)
  ap:
    ssid: "4in Bus Fallback"
    password: !secret bus_4in_fallback_password

captive_portal:


# =============================================================================
#  Board: 4" ESP32 display, 320x480 ST7796S, resistive touch
#  ("ESP32-32E" 4.0" LCD Display; module ESP32-32E N4: 4 MB flash, no PSRAM).
#  XPT2046 touch SHARES the display's SPI bus, backlight on GPIO27, RGB LED.
#  Notes, pinout and quirks: esp32-4in-st7796s.md
#
#  IDs other files can use:
#    tft (display), touch (touchscreen), backlight (light), rgb_led (light),
#    tft_spi (spi, display and touch), backlight_pwm, led_r/g/b (outputs)
#
#  Per-device settings (override in the device file's substitutions):
#    touch_x_min / touch_x_max / touch_y_min / touch_y_max   calibration
#
#  Portrait (USB at the bottom) is LVGL `rotation: 0`; landscape with the USB
#  on the right is `rotation: 90`. Touch follows either with no extra setting.
# =============================================================================

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ONE SPI bus, shared by the display and the touch controller (separate CS).
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12       # strapping pin (harmless warning)

display:
  - platform: mipi_spi
    id: tft
    # No board preset in ESPHome; the generic ST7796 model's defaults (BGR,
    # no inversion, mirror_x) give correct colours and orientation here.
    model: ST7796
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    # The panel's reset is wired to the ESP32's EN, so no reset_pin.
    data_rate: 40MHz
    # LVGL does the drawing, so the display needs no update loop of its own.
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: tft_spi
    cs_pin: GPIO33
    interrupt_pin:         # touch IRQ. GPIO36 is input-only with no internal
      number: GPIO36       # pull-up; the board has an external one.
      mode: input
    # Portrait, USB at the bottom: raw X runs left->right, raw Y runs
    # bottom->top. ESPHome wants min < max, so Y is flipped here instead.
    calibration:
      x_min: ${touch_x_min}
      x_max: ${touch_x_max}
      y_min: ${touch_y_min}
      y_max: ${touch_y_max}
    transform:
      mirror_y: true
    # Touch: one purpose only. Tapping anywhere turns the backlight to full for
    # ${touch_boost_s}. Because it's "tap anywhere", calibration hardly matters.
    # (from projects/bus-display/brightness.yaml)
    on_touch:
      - script.execute: touch_boost

output:
  # Backlight, PWM so it can dim.
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
    frequency: 5000Hz
  # RGB LED: active LOW (pin low = LED on), hence inverted.
  - platform: ledc
    pin: GPIO22
    id: led_r
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_g
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_b
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    # Always on at boot, and linear so a percentage is real PWM duty. Same
    # reasons as the CYD (see cyd-2432s028.md, quirks).
    restore_mode: ALWAYS_ON
    default_transition_length: 1s
    gamma_correct: 1.0

  # Off at boot and nothing on the device turns it on; it's exposed to HA in
  # case you want to automate it.
  - platform: rgb
    id: rgb_led
    name: Status LED
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF


# =============================================================================
#  Project: bus display, two stops side by side (480x320)
#  The next departure from each of two stops, pushed from Home Assistant.
#  Same rules as the single-stop bus-display.yaml (lateness colours, timetable
#  guesses in grey, STALE, LAST BUS, night screen), once per stop.
#  Needs: a 480x320 landscape LVGL display (`tft`), touchscreen `touch`,
#  light `backlight`. Include brightness.yaml (the backlight) alongside it.
#
#  Screen (landscape, 480x320):
#    +-----------------------+-----------------------+
#    | o NO HA                                 19:42 |  connection + clock
#    | HIGH STREET           | MARKET SQUARE         |  stop names
#    |  17         +------+  |   4         +------+  |
#    |             |  S9  |  |             | 700  |  |  minutes to go, route
#    |  min        +------+  |  min          STALE   |  feed warning
#    |  19:59   [ On time ]  |  19:46  [2 min late]  |  expected time, lateness
#    |  to Wantage           |  to Oxford            |
#    |  Then 20:29 S9        |  Then 19:58 700       |  following / LAST BUS
#    +-----------------------+-----------------------+
#
#  Each stop's entities are substitutions (s1_* left, s2_* right): set them
#  in the device file. See README.md for what each entity provides.
# =============================================================================

api:
  on_client_connected:
    - script.execute: refresh
  on_client_disconnected:
    - script.execute: refresh

  # (from esp32-4in-bus-display-2stop.yaml)
  encryption:
    key: !secret bus_4in_api_key

# =============================================================================
#  Data from Home Assistant, per stop (s1_ left card, s2_ right card).
#  Everything arrives as text; booleans as "on"/"off".
# =============================================================================
text_sensor:
  # ---- stop 1: ${s1_title} ----
  # The entity state: a timestamp, or unknown/unavailable when there's no bus.
  # This decides "is there a bus?" (HA doesn't clear attributes).
  - platform: homeassistant
    id: s1_state
    entity_id: ${s1_next}
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_line
    entity_id: ${s1_next}
    attribute: line
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_dest
    entity_id: ${s1_next}
    attribute: destination
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_sched
    entity_id: ${s1_next}
    attribute: scheduled
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_delay
    entity_id: ${s1_next}
    attribute: delay
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_live
    entity_id: ${s1_next}
    attribute: live
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
    id: s1_fol
    entity_id: ${s1_next}
    attribute: following
    internal: true
    on_value: {script.execute: refresh}
  - platform: homeassistant
