                  id: lbl_conn
                  align: LEFT_MID
                  x: 30
                  text: ""
                  text_font: font_small
                  text_color: 0xDC2626
              - label:
                  id: lbl_clock
                  align: RIGHT_MID
                  x: -10
                  text: "--:--"
                  text_font: font_med
                  text_color: 0xB0B0B0
        # ---------- divider between the cards ----------
        - obj:
            x: 239
            y: 38
            width: 2
            height: 272
            bg_color: 0x333333
            border_width: 0
            radius: 0
        # ---------- stop 1 ----------
        - obj:
