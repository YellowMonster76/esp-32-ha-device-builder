#    wifi_password
#    wifi_ssid
# =============================================================================

# =============================================================================
#  Device: 4in Light Panel (12 tiles)
#  Board:   boards/esp32-4in-st7796s.yaml   (MAC 20:50:0d:1d:fe:8f (last 3 bytes randomised))
#  Project: projects/light-panel (light-panel-480x320.yaml)
#
#  EXAMPLE ENTITIES: the tiles below are made up, to show a full 12-tile
#  panel. Replace them with your own before installing. The layout and touch
#  were tested on the real board with the demo build; this file hasn't been
#  run against HA.
# =============================================================================


# =============================================================================
#  Shared by every device: identity, logging, OTA, Wi-Fi.
#
#  The device file must provide:
#    substitutions: name, friendly_name
#    api:  encryption: key: !secret <device>_api_key
#    wifi: ap: ssid / password (the fallback hotspot)
#  Those stay in the device file because they're per-unit, and !secret can't
#  be driven by a substitution.
# =============================================================================

substitutions:
  # --- from common/base.yaml ---
  # C++ expression projects use for "is Home Assistant connected?". Demo builds
  # (tools/demo) override it to fake a connection without HA.
  ha_connected: "(api::global_api_server != nullptr && api::global_api_server->is_connected_with_state_subscription())"

  # --- from boards/esp32-4in-st7796s.yaml ---
  # ---- Touch calibration (raw XPT2046 readings at the screen edges) --------
  # Measured on our unit. Measure each unit if it has touch targets: see
  # esp32-4in-st7796s.md, "Calibrating touch".
  touch_x_min: "109"  # set in esp32-4in-light-panel-12tile.yaml
  touch_x_max: "4034"  # set in esp32-4in-light-panel-12tile.yaml
  touch_y_min: "140"  # set in esp32-4in-light-panel-12tile.yaml
  touch_y_max: "3984"  # set in esp32-4in-light-panel-12tile.yaml

  # --- from esp32-4in-light-panel-12tile.yaml ---
  name: esp32-4in-light-panel
  friendly_name: 4in Light Panel

  # ---- The twelve tiles: b1-b4 top row left to right, b5-b8 middle row, ---
  # ---- b9-b12 bottom row. Names up to about 13 characters. ----------------
  # Icons: pick a code from the list under `font:` in
  # projects/light-panel/light-panel-480x320.yaml.
  # Top row: living room lights.
  b1_entity: light.living_room_ceiling
  b1_name: "Ceiling"
  b1_icon: "\U000F0769"      # mdi:ceiling-light
  b2_entity: light.living_room_floor_lamp
  b2_name: "Floor lamp"
  b2_icon: "\U000F08DD"      # mdi:floor-lamp
  b3_entity: light.living_room_lamps
  b3_name: "Lamps"
  b3_icon: "\U000F1576"      # mdi:lamps
  b4_entity: light.tv_backlight
  b4_name: "TV backlight"
  b4_icon: "\U000F1051"      # mdi:led-strip-variant
  # Middle row: kitchen, dining, outside.
  b5_entity: light.kitchen_spotlights
  b5_name: "Kitchen"
  b5_icon: "\U000F179B"      # mdi:light-recessed
  b6_entity: light.kitchen_worktop
  b6_name: "Worktop"
  b6_icon: "\U000F04C9"      # mdi:spotlight-beam
  b7_entity: light.dining_pendant
  b7_name: "Dining"
  b7_icon: "\U000F1793"      # mdi:chandelier
  b8_entity: light.garden_lights
  b8_name: "Garden"
  b8_icon: "\U000F1054"      # mdi:outdoor-lamp
  # Bottom row: plugs and other things that toggle. Any entity whose state is
  # "on"/"off" works (light, switch, fan, input_boolean...). Not media
  # players: "playing"/"idle" would show as unavailable.
  b9_entity: switch.coffee_machine
  b9_name: "Coffee"
  b9_icon: "\U000F109F"      # mdi:coffee-maker
  b10_entity: switch.speaker_plug
  b10_name: "Speaker"
  b10_icon: "\U000F071F"     # mdi:speaker-wireless
  b11_entity: fan.living_room_fan
  b11_name: "Fan"
  b11_icon: "\U000F1797"     # mdi:ceiling-fan
  b12_entity: switch.fairy_lights
  b12_name: "Fairy lights"
  b12_icon: "\U000F12BA"     # mdi:string-lights

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  # (from projects/light-panel/light-panel-480x320.yaml)
  on_boot:
    priority: -100
    then:
      - script.execute: show_connection

logger:
  level: INFO

# OTA uploads are encrypted and authenticated with the device's API key (an
# empty `encryption:` block means "use the api key"), so no OTA password.
ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails, the device starts its own hotspot (ssid/password set in the
  # device file). Join it and browse to 192.168.4.1 to enter new Wi-Fi details.

  # (from esp32-4in-light-panel-12tile.yaml)
  ap:
    ssid: "4in Panel Fallback"
    password: !secret panel_4in_fallback_password

captive_portal:


# =============================================================================
#  Board: 4" ESP32 display, 320x480 ST7796S, resistive touch
#  ("ESP32-32E" 4.0" LCD Display; module ESP32-32E N4: 4 MB flash, no PSRAM).
#  XPT2046 touch SHARES the display's SPI bus, backlight on GPIO27, RGB LED.
#  Notes, pinout and quirks: esp32-4in-st7796s.md
#
#  IDs other files can use:
#    tft (display), touch (touchscreen), backlight (light), rgb_led (light),
#    tft_spi (spi, display and touch), backlight_pwm, led_r/g/b (outputs)
#
#  Per-device settings (override in the device file's substitutions):
#    touch_x_min / touch_x_max / touch_y_min / touch_y_max   calibration
#
#  Portrait (USB at the bottom) is LVGL `rotation: 0`; landscape with the USB
#  on the right is `rotation: 90`. Touch follows either with no extra setting.
# =============================================================================

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ONE SPI bus, shared by the display and the touch controller (separate CS).
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12       # strapping pin (harmless warning)

display:
  - platform: mipi_spi
    id: tft
    # No board preset in ESPHome; the generic ST7796 model's defaults (BGR,
    # no inversion, mirror_x) give correct colours and orientation here.
    model: ST7796
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    # The panel's reset is wired to the ESP32's EN, so no reset_pin.
    data_rate: 40MHz
    # LVGL does the drawing, so the display needs no update loop of its own.
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: tft_spi
    cs_pin: GPIO33
    interrupt_pin:         # touch IRQ. GPIO36 is input-only with no internal
      number: GPIO36       # pull-up; the board has an external one.
      mode: input
    # Portrait, USB at the bottom: raw X runs left->right, raw Y runs
    # bottom->top. ESPHome wants min < max, so Y is flipped here instead.
    calibration:
      x_min: ${touch_x_min}
      x_max: ${touch_x_max}
      y_min: ${touch_y_min}
      y_max: ${touch_y_max}
    transform:
      mirror_y: true
    # (from projects/light-panel/light-panel-480x320.yaml)
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw=%d,%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]
          level: INFO
    # (from projects/light-panel/light-panel-480x320.yaml)
    on_release:
      # While the screen is off LVGL is paused and ignores touches, so this
      # tap only wakes the screen.
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

output:
  # Backlight, PWM so it can dim.
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
    frequency: 5000Hz
  # RGB LED: active LOW (pin low = LED on), hence inverted.
  - platform: ledc
    pin: GPIO22
    id: led_r
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_g
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_b
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    # Always on at boot, and linear so a percentage is real PWM duty. Same
    # reasons as the CYD (see cyd-2432s028.md, quirks).
    restore_mode: ALWAYS_ON
    # Awake brightness: set it from HA with the Backlight light.
    default_transition_length: 0.3s  # set in projects/light-panel/light-panel-480x320.yaml
    gamma_correct: 1.0

  # Off at boot and nothing on the device turns it on; it's exposed to HA in
  # case you want to automate it.
  - platform: rgb
    id: rgb_led
    name: Status LED
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF


# =============================================================================
#  Project: light panel  (GENERATED by tools/gen_light_panel.py; edit that)
#  12 touch tiles (4 x 3) that toggle Home Assistant lights and switches.
#  Needs: a 480x320 landscape LVGL display (`tft`) with a calibrated
#  touchscreen `touch`, light `backlight`.
#
#  Tap a tile to toggle it (any light or switch). Tiles show the real state:
#    amber tile        on
#    dark tile         off
#    faded, red edge   HA says it is unavailable (tap does nothing)
#  A red banner appears if the panel loses its connection to HA.
#
#  The screen goes off after "Screen timeout" (set in HA, default 60 s).
#  While it's off, the first tap only wakes it, so you can't switch a light
#  by accident in the dark.
#
#  The device file sets each tile with three substitutions, b1..b12:
#    bN_entity   e.g. light.kitchen_light (any entity that can toggle)
#    bN_name     about 13 characters max
#    bN_icon     one of the 100 codes listed under `font:` below,
#                e.g. "\U000F0769" for mdi:ceiling-light
#  Tiles: b1-b4 top row left to right, b5-b8 middle row, b9-b12 bottom row.
#
#  HA side: in the ESPHome integration's options for the device, turn on
#  "Allow the device to perform Home Assistant actions", or taps do nothing.
# =============================================================================

api:
  on_client_connected:
    - script.execute: show_connection
  on_client_disconnected:
    - script.execute: show_connection

  # (from esp32-4in-light-panel-12tile.yaml)
  encryption:
    key: !secret panel_4in_api_key

number:
  - platform: template
    id: screen_timeout
    name: Screen timeout
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 10
    max_value: 600
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    entity_category: config

# =============================================================================
#  Entity states from Home Assistant: "on", "off", "unavailable", ...
# =============================================================================
text_sensor:
  - platform: homeassistant
    id: st1
    entity_id: ${b1_entity}
    internal: true
    on_value:
      - lvgl.widget.update:
