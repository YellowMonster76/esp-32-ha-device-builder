# =============================================================================
#  Touch calibration firmware for the CYD (ESP32-2432S028R)
#
#  Standalone on purpose: no Wi-Fi, no HA, no LVGL. The screen shows ESPHome's
#  test card, which also confirms the display model and colours. Every touch
#  is logged with its raw XPT2046 reading.
#
#  1. Flash:      esphome run cyd-touch-calibration.yaml --device COM4
#  2. Log taps:   python ../serial_log.py COM4 --grep raw_x= --out taps.log
#  3. USB sockets on the right, tap with a fingernail about 5 mm in from each
#     corner, a second apart: top-left, top-right, bottom-right, bottom-left,
#     then the centre.
#  4. Compute:    python calc_calibration.py taps.log
#  5. Put the four values in the device file's substitutions.
#
#  Pins match boards/cyd-2432s028.yaml. Change `model` for other revisions.
# =============================================================================

esphome:
  name: cyd-touchcal

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: bl_out

light:
  - platform: monochromatic
    output: bl_out
    name: Backlight
    restore_mode: ALWAYS_ON

# No drawing configured, so mipi_spi shows its built-in test card.
display:
  - platform: mipi_spi
    id: tft
    model: ESP32-2432S028-7789
    spi_id: tft_spi
    rotation: 90

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin:
      number: GPIO36
      mode: input
    display: tft
    calibration:          # full raw range: we only want the raw values
      x_min: 0
      x_max: 4095
      y_min: 0
      y_max: 4095
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "TOUCH raw_x=%d raw_y=%d", touch.x_raw, touch.y_raw);
