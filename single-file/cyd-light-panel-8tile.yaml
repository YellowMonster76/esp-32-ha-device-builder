# =============================================================================
#  GENERATED single-file version of cyd-light-panel-8tile.yaml.
#  Paste the whole file into ESPHome Device Builder. Don't edit it here:
#  edit the source files, then run `python tools/flatten.py`.
#
#  Built from:
#    common/base.yaml
#    boards/cyd-2432s028.yaml
#    projects/light-panel/light-panel.yaml
#    cyd-light-panel-8tile.yaml
#
#  Secrets it needs in Device Builder's secrets.yaml:
#    cyd_panel_api_key
#    cyd_panel_fallback_password
#    wifi_password
#    wifi_ssid
# =============================================================================

# =============================================================================
#  Device: CYD Light Panel
#  Board:   boards/cyd-2432s028.yaml   (twin-USB ST7789V unit, MAC d4:e9:f4:ae:85:a6 (last 3 bytes randomised))
#  Project: projects/light-panel
# =============================================================================


# =============================================================================
#  Shared by every device: identity, logging, OTA, Wi-Fi.
#
#  The device file must provide:
#    substitutions: name, friendly_name
#    api:  encryption: key: !secret <device>_api_key
#    wifi: ap: ssid / password (the fallback hotspot)
#  Those stay in the device file because they're per-unit, and !secret can't
#  be driven by a substitution.
# =============================================================================

substitutions:
  # --- from common/base.yaml ---
  # C++ expression projects use for "is Home Assistant connected?". Demo builds
  # (tools/demo) override it to fake a connection without HA.
  ha_connected: "(api::global_api_server != nullptr && api::global_api_server->is_connected_with_state_subscription())"

  # --- from boards/cyd-2432s028.yaml ---
  # ---- WHICH BOARD REVISION? ----------------------------------------------
  #   ESP32-2432S028       single micro-USB board (ILI9341)
  #   ESP32-2432S028-7789  USB-C + micro-USB board with ST7789V
  #   ESP32-2432S028-9342  USB-C + micro-USB board with ILI9342
  # The preset sets the controller, CS=GPIO15, DC=GPIO2 and 40 MHz SPI.
  display_model: ESP32-2432S028-7789

  # ---- Touch calibration (raw XPT2046 readings at the screen edges) --------
  # Typical values. Measure each unit if it has touch targets: see
  # cyd-2432s028.md, "Calibrating touch".
  touch_x_min: "472"  # set in cyd-light-panel-8tile.yaml
  touch_x_max: "3820"  # set in cyd-light-panel-8tile.yaml
  touch_y_min: "170"  # set in cyd-light-panel-8tile.yaml
  touch_y_max: "3879"  # set in cyd-light-panel-8tile.yaml

  # --- from cyd-light-panel-8tile.yaml ---
  name: cyd-light-panel-8tile
  friendly_name: CYD Light Panel

  # ---- The eight tiles: b1-b4 top row left to right, b5-b8 bottom row -----
  # Icons: pick a code from the list under `font:` in
  # projects/light-panel/light-panel.yaml.
  # Top row: radios. Icon = where it plays, name = station.
  b1_entity: switch.radio_6_nad
  b1_name: "Radio 6"
  b1_icon: "\U000F0030"      # mdi:amplifier (NAD)
  b2_entity: switch.radio_gaga_nad
  b2_name: "Gaga"
  b2_icon: "\U000F0030"      # mdi:amplifier (NAD)
  b3_entity: switch.radio_6_living_room
  b3_name: "Radio 6"
  b3_icon: "\U000F04B9"      # mdi:sofa (Living Room)
  b4_entity: switch.radio_gaga_living_room
  b4_name: "Gaga"
  b4_icon: "\U000F04B9"      # mdi:sofa (Living Room)
  # Bottom row: lights.
  b5_entity: light.kitchen_light
  b5_name: "Kitchen"
  b5_icon: "\U000F04DE"      # mdi:stove
  b6_entity: light.dining_room_lamps
  b6_name: "Dining"
  b6_icon: "\U000F0A70"      # mdi:silverware-fork-knife
  b7_entity: light.corner_lamp
  b7_name: "Corner"
  b7_icon: "\U000F08DD"      # mdi:floor-lamp
  b8_entity: light.big_lights
  b8_name: "Big lights"
  b8_icon: "\U000F0769"      # mdi:ceiling-light

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  # (from projects/light-panel/light-panel.yaml)
  on_boot:
    priority: -100
    then:
      - script.execute: show_connection

logger:
  level: INFO

# OTA uploads are encrypted and authenticated with the device's API key (an
# empty `encryption:` block means "use the api key"), so no OTA password.
ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails, the device starts its own hotspot (ssid/password set in the
  # device file). Join it and browse to 192.168.4.1 to enter new Wi-Fi details.

  # (from cyd-light-panel-8tile.yaml)
  ap:
    ssid: "CYD Panel Fallback"
    password: !secret cyd_panel_fallback_password

captive_portal:


# =============================================================================
#  Board: ESP32-2432S028R "Cheap Yellow Display" (CYD)
#  ESP32-WROOM-32 (4 MB flash, no PSRAM), 2.8" 320x240 SPI display,
#  XPT2046 resistive touch on its own SPI bus, backlight on GPIO21, RGB LED.
#  Notes, pinout and quirks: cyd-2432s028.md
#
#  IDs other files can use:
#    tft (display), touch (touchscreen), backlight (light), rgb_led (light),
#    tft_spi / touch_spi (spi), backlight_pwm, led_r/g/b (outputs)
#
#  Per-device settings (override in the device file's substitutions):
#    display_model   which board revision, see below
#    touch_x_min / touch_x_max / touch_y_min / touch_y_max   calibration
#
#  Landscape layout assumes LVGL `rotation: 90` (USB sockets on the right).
# =============================================================================

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# The CYD has TWO SPI buses: one for the display, a separate one for touch.
spi:
  - id: tft_spi            # display
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi          # XPT2046 touch controller
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39       # GPIO39 is input-only, fine for MISO

display:
  - platform: mipi_spi
    id: tft
    model: ${display_model}
    spi_id: tft_spi
    # LVGL does the drawing, so the display needs no update loop of its own.
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin:         # touch IRQ. GPIO36 is input-only with no internal
      number: GPIO36       # pull-up; the board has an external one.
      mode: input
    # With the USB sockets on the right: raw X runs top->bottom, raw Y runs
    # left->right.
    calibration:
      x_min: ${touch_x_min}
      x_max: ${touch_x_max}
      y_min: ${touch_y_min}
      y_max: ${touch_y_max}
    # Needed with LVGL rotation 90, otherwise taps on the top row land on the
    # bottom row and vice versa. (Found on the twin-USB ST7789V revision.)
    transform:
      mirror_x: true
    # (from projects/light-panel/light-panel.yaml)
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw=%d,%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]
          level: INFO
    # (from projects/light-panel/light-panel.yaml)
    on_release:
      # While the screen is off LVGL is paused and ignores touches, so this
      # tap only wakes the screen.
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

output:
  # Backlight, PWM so it can dim.
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 5000Hz
  # RGB LED on the back: active LOW (pin low = LED on), hence inverted.
  - platform: ledc
    pin: GPIO4
    id: led_r
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_g
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_b
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    # Always on at boot. (Restoring the last state could bring the screen back
    # dark if it was off when unplugged.)
    restore_mode: ALWAYS_ON
    # Awake brightness: set it from HA with the Backlight light.
    default_transition_length: 0.3s  # set in projects/light-panel/light-panel.yaml
    # Linear: "8%" really is 8% PWM duty. With gamma 2.2, 8% became ~0.4%
    # duty and the screen looked switched off.
    gamma_correct: 1.0

  # The RGB LED is very bright. Off at boot and nothing on the device turns it
  # on; it's exposed to HA in case you want to automate it.
  - platform: rgb
    id: rgb_led
    name: Status LED
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF


# =============================================================================
#  Project: light panel  (GENERATED by tools/gen_light_panel.py; edit that)
#  8 touch tiles (4 x 2) that toggle Home Assistant lights and switches.
#  Needs: a 320x240 landscape LVGL display (`tft`) with a calibrated
#  touchscreen `touch`, light `backlight`.
#
#  Tap a tile to toggle it (any light or switch). Tiles show the real state:
#    amber tile        on
#    dark tile         off
#    faded, red edge   HA says it is unavailable (tap does nothing)
#  A red banner appears if the panel loses its connection to HA.
#
#  The screen goes off after "Screen timeout" (set in HA, default 60 s).
#  While it's off, the first tap only wakes it, so you can't switch a light
#  by accident in the dark.
#
#  The device file sets each tile with three substitutions, b1..b8:
#    bN_entity   e.g. light.kitchen_light (any entity that can toggle)
#    bN_name     about 9 characters max
#    bN_icon     one of the 100 codes listed under `font:` below,
#                e.g. "\U000F0769" for mdi:ceiling-light
#  Tiles: b1-b4 top row left to right, b5-b8 bottom row.
#
#  HA side: in the ESPHome integration's options for the device, turn on
#  "Allow the device to perform Home Assistant actions", or taps do nothing.
# =============================================================================

api:
  on_client_connected:
    - script.execute: show_connection
  on_client_disconnected:
    - script.execute: show_connection

  # (from cyd-light-panel-8tile.yaml)
  encryption:
    key: !secret cyd_panel_api_key

number:
  - platform: template
    id: screen_timeout
    name: Screen timeout
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 10
    max_value: 600
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    entity_category: config

# =============================================================================
#  Entity states from Home Assistant: "on", "off", "unavailable", ...
# =============================================================================
text_sensor:
  - platform: homeassistant
    id: st1
    entity_id: ${b1_entity}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn1
          state:
            checked: !lambda 'return x == "on";'
            disabled: !lambda 'return x != "on" && x != "off";'
  - platform: homeassistant
    id: st2
    entity_id: ${b2_entity}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn2
          state:
            checked: !lambda 'return x == "on";'
            disabled: !lambda 'return x != "on" && x != "off";'
