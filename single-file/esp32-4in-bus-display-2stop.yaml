  displays: tft
  rotation: 90              # landscape, USB socket on the right
  buffer_size: 25%
  default_font: font_small
  style_definitions:
    - id: plain             # transparent container, no border/padding/scroll
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
  pages:
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      pad_all: 0
      widgets:
        # ---------- top bar: connection + clock ----------
        - obj:
            x: 0
            y: 0
            width: 480
            height: 28
            bg_color: 0x1C1C1C
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            widgets:
