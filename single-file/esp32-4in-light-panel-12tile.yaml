# =============================================================================
#  Layout (LVGL)
# =============================================================================
lvgl:
  displays: tft
  rotation: 90             # landscape, USB socket on the right
  buffer_size: 25%
  default_font: font_name
  # Screen off after the timeout. LVGL pauses, so the next tap only wakes it.
  on_idle:
    timeout: !lambda "return (uint32_t) (id(screen_timeout).state * 1000);"
    then:
      - light.turn_off: backlight
      - lvgl.pause:
  style_definitions:
    # Icon and name inherit text_color from the tile, so they follow its state.
    - id: tile
      radius: 10
      border_width: 0
      pad_all: 0
      shadow_width: 0
      bg_color: 0x1E1E1E
      text_color: 0x9A9A9A
  pages:
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      pad_all: 0
      widgets:
        - button:
            id: btn1
            styles: tile
            x: 4
            y: 4
            width: 115
            height: 101
            state:
              disabled: true           # until HA reports the state
            pressed:
              bg_color: 0x3A3A3A
            checked:                   # entity is on
              bg_color: 0xF59E0B
              text_color: 0x1A1A1A
            disabled:                  # entity unavailable
              bg_color: 0x141414
              text_color: 0x4A4A4A
              border_width: 2
              border_color: 0x7F1D1D
            on_click:
              - logger.log: {format: "Tapped ${b1_name}", level: INFO}
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${b1_entity}
            widgets:
              - label:
                  align: TOP_MID
                  y: 10
                  text_font: font_icons
                  text: "${b1_icon}"
              - label:
                  align: BOTTOM_MID
                  y: -10
                  width: 111
                  height: 20
                  long_mode: DOT
                  text_align: CENTER
                  text: "${b1_name}"
