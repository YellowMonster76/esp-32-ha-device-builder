# =============================================================================
#  GENERATED single-file version of esp32-4in-music-panel.yaml.
#  Paste the whole file into ESPHome Device Builder. Don't edit it here:
#  edit the source files, then run `python tools/flatten.py`.
#
#  Built from:
#    common/base.yaml
#    boards/esp32-4in-st7796s.yaml
#    projects/music-panel/music-panel.yaml
#    esp32-4in-music-panel.yaml
#
#  Secrets it needs in Device Builder's secrets.yaml:
#    music_4in_api_key
#    music_4in_fallback_password
#    wifi_password
#    wifi_ssid
# =============================================================================

# =============================================================================
#  Device: 4in Music Panel (Music Assistant)
#  Board:   boards/esp32-4in-st7796s.yaml   (MAC 20:50:0d:1d:fe:8f (last 3 bytes randomised))
#  Project: projects/music-panel
#
#  EXAMPLE SPEAKERS: the five players below are placeholders. Use your own
#  Music Assistant players (any media_player from the Music Assistant
#  integration, including MA groups), and your own MA config entry id.
# =============================================================================


# =============================================================================
#  Shared by every device: identity, logging, OTA, Wi-Fi.
#
#  The device file must provide:
#    substitutions: name, friendly_name
#    api:  encryption: key: !secret <device>_api_key
#    wifi: ap: ssid / password (the fallback hotspot)
#  Those stay in the device file because they're per-unit, and !secret can't
#  be driven by a substitution.
# =============================================================================

substitutions:
  # --- from common/base.yaml ---
  # C++ expression projects use for "is Home Assistant connected?". Demo builds
  # (tools/demo) override it to fake a connection without HA.
  ha_connected: "(api::global_api_server != nullptr && api::global_api_server->is_connected_with_state_subscription())"

  # --- from boards/esp32-4in-st7796s.yaml ---
  # ---- Touch calibration (raw XPT2046 readings at the screen edges) --------
  # Measured on our unit. Measure each unit if it has touch targets: see
  # esp32-4in-st7796s.md, "Calibrating touch".
  touch_x_min: "109"
  touch_x_max: "4034"
  touch_y_min: "140"
  touch_y_max: "3984"

  # --- from projects/music-panel/music-panel.yaml ---
  # ---- Music Assistant ------------------------------------------------------
  # Your MA config entry: Developer tools -> Actions -> "Music Assistant: Get
  # library", pick your instance, switch to YAML mode: config_entry_id.
  ma_config_entry: "YOUR_MA_CONFIG_ENTRY_ID"  # set in esp32-4in-music-panel.yaml
  fav_limit: "30"            # most favourites loaded per tab

  # ---- The five speaker buttons (any MA player, including MA groups) --------
  # Names wrap onto two lines; about 11 characters fit per line.
  sp1_name: "Living Room Sync"  # set in esp32-4in-music-panel.yaml
  sp1_entity: media_player.living_room_sync  # set in esp32-4in-music-panel.yaml
  sp2_name: "Living Room"  # set in esp32-4in-music-panel.yaml
  sp2_entity: media_player.living_room  # set in esp32-4in-music-panel.yaml
  sp3_name: "NAD"  # set in esp32-4in-music-panel.yaml
  sp3_entity: media_player.nad  # set in esp32-4in-music-panel.yaml
  sp4_name: "Kitchen"  # set in esp32-4in-music-panel.yaml
  sp4_entity: media_player.kitchen  # set in esp32-4in-music-panel.yaml
  sp5_name: "Utility Room"  # set in esp32-4in-music-panel.yaml
  sp5_entity: media_player.utility_room  # set in esp32-4in-music-panel.yaml

  # --- from esp32-4in-music-panel.yaml ---
  name: esp32-4in-music-panel
  friendly_name: 4in Music Panel

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  # (from projects/music-panel/music-panel.yaml)
  on_boot:
    priority: -100
    then:
      - script.execute: show_connection
      - script.execute: show_selection
      - script.execute: show_now_playing

logger:
  level: INFO

# OTA uploads are encrypted and authenticated with the device's API key (an
# empty `encryption:` block means "use the api key"), so no OTA password.
ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails, the device starts its own hotspot (ssid/password set in the
  # device file). Join it and browse to 192.168.4.1 to enter new Wi-Fi details.

  # (from esp32-4in-music-panel.yaml)
  ap:
    ssid: "4in Music Fallback"
    password: !secret music_4in_fallback_password

captive_portal:


# =============================================================================
#  Board: 4" ESP32 display, 320x480 ST7796S, resistive touch
#  ("ESP32-32E" 4.0" LCD Display; module ESP32-32E N4: 4 MB flash, no PSRAM).
#  XPT2046 touch SHARES the display's SPI bus, backlight on GPIO27, RGB LED.
#  Notes, pinout and quirks: esp32-4in-st7796s.md
#
#  IDs other files can use:
#    tft (display), touch (touchscreen), backlight (light), rgb_led (light),
#    tft_spi (spi, display and touch), backlight_pwm, led_r/g/b (outputs)
#
#  Per-device settings (override in the device file's substitutions):
#    touch_x_min / touch_x_max / touch_y_min / touch_y_max   calibration
#
#  Portrait (USB at the bottom) is LVGL `rotation: 0`; landscape with the USB
#  on the right is `rotation: 90`. Touch follows either with no extra setting.
# =============================================================================

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ONE SPI bus, shared by the display and the touch controller (separate CS).
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12       # strapping pin (harmless warning)

display:
  - platform: mipi_spi
    id: tft
    # No board preset in ESPHome; the generic ST7796 model's defaults (BGR,
    # no inversion, mirror_x) give correct colours and orientation here.
    model: ST7796
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    # The panel's reset is wired to the ESP32's EN, so no reset_pin.
    data_rate: 40MHz
    # LVGL does the drawing, so the display needs no update loop of its own.
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: tft_spi
    cs_pin: GPIO33
    interrupt_pin:         # touch IRQ. GPIO36 is input-only with no internal
      number: GPIO36       # pull-up; the board has an external one.
      mode: input
    # Portrait, USB at the bottom: raw X runs left->right, raw Y runs
    # bottom->top. ESPHome wants min < max, so Y is flipped here instead.
    calibration:
      x_min: ${touch_x_min}
      x_max: ${touch_x_max}
      y_min: ${touch_y_min}
      y_max: ${touch_y_max}
    transform:
      mirror_y: true
    # (from projects/music-panel/music-panel.yaml)
    on_release:
      # While the screen is off LVGL is paused and ignores touches, so this
      # tap only wakes the screen.
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

output:
  # Backlight, PWM so it can dim.
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
    frequency: 5000Hz
  # RGB LED: active LOW (pin low = LED on), hence inverted.
  - platform: ledc
    pin: GPIO22
    id: led_r
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_g
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_b
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    # Always on at boot, and linear so a percentage is real PWM duty. Same
    # reasons as the CYD (see cyd-2432s028.md, quirks).
    restore_mode: ALWAYS_ON
    default_transition_length: 0.3s  # set in projects/music-panel/music-panel.yaml
    gamma_correct: 1.0

  # Off at boot and nothing on the device turns it on; it's exposed to HA in
  # case you want to automate it.
  - platform: rgb
    id: rgb_led
    name: Status LED
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF


# =============================================================================
#  Project: music panel (Music Assistant)
#  Pick a speaker or group, pick one of your Music Assistant favourites
#  (radio, playlists, albums), and it plays there. Shows what's playing on the
#  chosen speaker, with previous / play-pause / next and volume.
#  Needs: a 480x320 landscape LVGL display (`tft`), a calibrated touchscreen
#  `touch`, light `backlight`.
#
#  Screen (landscape, 480x320):
#    +----------------------------------------------+
#    | [Living ][Living ][ NAD  ][Kitchen][Utility]|  where to play
#    | [Room Sy][ Room  ][      ][       ][ Room  ]|  (speakers, groups)
#    | [ Radio ]    [ Playlists ]    [ Albums ]     |  which favourites
#    | +--------------------+ +-------------------+ |
#    | | BBC Radio 6 Music  | | I Should Coco     | |  your MA favourites,
#    | |                    | | Supergrass        | |  fetched live (scrolls)
#    | +--------------------+ +-------------------+ |
#    | Song title     |<< >|| [] >>|  [vol 35%]   |  now playing; the volume
#    |                                              |  button opens a big panel
#    | Artist                                       |
#    +----------------------------------------------+
#
#  The favourites come from Music Assistant itself (music_assistant.
#  get_library, favourite: true), so heart something in MA and it appears
#  here the next time you open that tab. No reflash.
#
#  HA side: tick "Allow the device to perform Home Assistant actions" in the
#  ESPHome integration's options for the device, or nothing loads or plays.
# =============================================================================

api:
  on_client_connected:
    - script.execute: show_connection
    - delay: 2s                # let the state subscriptions settle first
    - script.execute: fetch
  on_client_disconnected:
    - script.execute: show_connection

  # (from esp32-4in-music-panel.yaml)
  encryption:
    key: !secret music_4in_api_key

number:
  - platform: template
    id: screen_timeout
    name: Screen timeout
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 10
    max_value: 600
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    entity_category: config

globals:
  - id: sel                    # which speaker button is chosen (0-based)
    type: int
    restore_value: true
    initial_value: "0"
  - id: tab                    # 0 radio, 1 playlists, 2 albums
    type: int
    restore_value: true
    initial_value: "0"
  - id: uris                   # media id of each favourite on screen
    type: std::vector<std::string>
  - id: dragging_volume        # don't move the slider under the finger
    type: bool
    initial_value: "false"

