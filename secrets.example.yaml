# Copy to secrets.yaml (never committed) or add these to HA's
# /config/esphome/secrets.yaml. Replace every value.
# New API key: python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"

# Shared by all devices (common/base.yaml)
wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"

# cyd-bus-display
cyd_bus_api_key: "base64-32-byte-key"
cyd_bus_fallback_password: "8-plus-characters"

# cyd-light-panel-8tile
cyd_panel_api_key: "base64-32-byte-key"
cyd_panel_fallback_password: "8-plus-characters"

# esp32-4in-light-panel-12tile
panel_4in_api_key: "base64-32-byte-key"
panel_4in_fallback_password: "8-plus-characters"
